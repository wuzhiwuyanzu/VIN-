name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packager
        run: python -m pip install pyinstaller openpyxl
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --collect-all openpyxl --collect-all et_xmlfile --hidden-import openpyxl.cell._writer --name VIN批量生成器 main.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: VIN批量生成器-Windows
          path: dist/VIN批量生成器.exe
          if-no-files-found: error
